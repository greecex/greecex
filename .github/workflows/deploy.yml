name: Deploy

on:
  push:
    branches: [main]
  # Pull requests build and start the release but never deploy it.
  pull_request:

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: greecex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost/greecex_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix deps.get
      - run: mix test

  # The release bundles ERTS, which links against the build host's glibc and
  # OpenSSL. Building inside Debian 13, the same release as the VPS, keeps
  # those in step with the server whatever GitHub's runner images become.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      debian: ${{ steps.resolve.outputs.debian }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: resolve
        run: bin/release-image | tee -a "$GITHUB_OUTPUT"

  build:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ${{ needs.image.outputs.image }}
    env:
      MIX_ENV: prod
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git ca-certificates
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --only prod
      - run: mix compile
      - run: mix assets.deploy
      - run: mix release

      - name: Package release
        run: tar czf greecex.tar.gz -C _build/prod/rel/greecex .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: greecex.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Start the release on plain Debian with only the libraries the VPS has.
  # A release that cannot boot there fails here instead of on the server.
  smoke:
    needs: [image, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ${{ needs.image.outputs.debian }}
    steps:
      - name: Install the VPS runtime libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libstdc++6 libssl3t64 libncurses6 ca-certificates
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Start the release
        env:
          DATABASE_URL: ecto://smoke:smoke@localhost/smoke
          SECRET_KEY_BASE: smoke-test-only-not-a-real-secret
        run: |
          mkdir rel
          tar xzf greecex.tar.gz -C rel
          rel/bin/greecex eval 'IO.puts(elem(hd(:crypto.info_lib()), 2))'

  deploy:
    needs: [test, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Never cancel a deploy halfway. It stops the app before swapping releases.
    concurrency:
      group: deploy-greecex
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          SSH_OPTS="-i ~/.ssh/deploy_key"

          scp $SSH_OPTS greecex.tar.gz deploy@"$VPS_HOST":/tmp/greecex.tar.gz

          ssh $SSH_OPTS deploy@"$VPS_HOST" bash <<'REMOTE'
            set -euo pipefail
            cd ~
            rm -rf /tmp/greecex-new
            mkdir /tmp/greecex-new
            tar xzf /tmp/greecex.tar.gz -C /tmp/greecex-new
            set -a; source /opt/greecex/.env; set +a

            # Prove the new release boots on this box before stopping the
            # running one. eval starts no distribution, so it can run alongside.
            /tmp/greecex-new/bin/greecex eval 'IO.puts(elem(hd(:crypto.info_lib()), 2))'

            sudo systemctl stop greecex
            rm -rf /opt/greecex/bin /opt/greecex/lib /opt/greecex/erts-* /opt/greecex/releases
            mv /tmp/greecex-new/* /opt/greecex/
            /opt/greecex/bin/migrate
            sudo systemctl start greecex
            rm -rf /tmp/greecex-new /tmp/greecex.tar.gz
          REMOTE
